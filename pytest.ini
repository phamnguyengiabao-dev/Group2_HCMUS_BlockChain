[pytest]
markers =
    hash: SHA-256 hash tests
    sign_verify: Digital signature sign/verify tests
    unit: Unit tests for individual modules
    integration: Integration tests spanning multiple modules
    e2e: End-to-end scenario tests (T1-T8)
    determinism: Determinism verification tests
    safety: Safety invariant tests
    liveness: Liveness tests
addopts = -ra
